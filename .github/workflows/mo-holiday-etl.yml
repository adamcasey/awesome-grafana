name: mo-holiday-season ETL

on:
  schedule:
    - cron: "17 11 * 11,12,1 1"   # Mondays 05:17 CT, Nov–Jan
    - cron: "17 11 26-31 12 *"    # daily after Christmas, to catch Dec 25 snow + MSHP release
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated sources (blank = all)"
        required: false
      snapshot:
        description: "download raw source files as an artifact instead of running the ETL"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mo-holiday-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mo-holiday-season
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mo-holiday-season/requirements.txt
      - name: Snapshot raw sources (debugging parsers against real files)
        if: ${{ inputs.snapshot }}
        run: |
          mkdir -p raw
          UA="awesome-grafana-mo-holiday-season/0.1"
          for y in $(seq 2015 2026); do
            curl -sSL -A "$UA" -o raw/mdc_$y.html -w "mdc $y %{http_code} %{size_download}\n" \
              "https://mdc.mo.gov/hunting-trapping/species/turkey/turkey-reports/turkey-harvest-summaries/$y-turkey-harvest-summary"
          done
          curl -sSL -A "$UA" -o raw/tiger_mo_counties.json -w "tiger %{http_code} %{size_download}\n" \
            "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query?where=STATE%3D%2729%27&outFields=NAME,GEOID,CENTLAT,CENTLON&returnGeometry=false&f=json"
          curl -sSL -A "$UA" -o raw/white_christmas.xlsx -w "ncei %{http_code} %{size_download}\n" \
            "https://www.ncei.noaa.gov/sites/default/files/2021-12/Christmas_day_snow_statistics_1991-2020_updated.xlsx"
      - name: Probe keyed APIs (keys are scrubbed from saved output)
        if: ${{ inputs.snapshot }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          scrub() { sed -e "s/${EIA_API_KEY:-__none__}/***/g" -e "s/${NASS_API_KEY:-__none__}/***/g"; }
          N="https://quickstats.nass.usda.gov/api"
          for p in statisticcat_desc short_desc unit_desc domain_desc; do
            curl -sS -G "$N/get_param_values/" --data-urlencode "key=$NASS_API_KEY" --data-urlencode "param=$p" \
              --data-urlencode "commodity_desc=CHRISTMAS TREES" --data-urlencode "state_alpha=MO" \
              --data-urlencode "source_desc=CENSUS" | scrub > raw/nass_xmas_$p.json
          done
          curl -sS -G "$N/get_param_values/" --data-urlencode "key=$NASS_API_KEY" --data-urlencode "param=short_desc" \
            --data-urlencode "commodity_desc=TURKEYS" --data-urlencode "state_alpha=MO" --data-urlencode "source_desc=SURVEY" \
            | scrub > raw/nass_turkeys_short_desc.json
          curl -sS -G "$N/get_param_values/" --data-urlencode "key=$NASS_API_KEY" --data-urlencode "param=commodity_desc" \
            --data-urlencode "state_alpha=MO" --data-urlencode "source_desc=CENSUS" --data-urlencode "sector_desc=CROPS" \
            | scrub > raw/nass_mo_census_crop_commodities.json
          curl -sS -G "$N/get_param_values/" --data-urlencode "key=$NASS_API_KEY" --data-urlencode "param=short_desc" \
            --data-urlencode "state_alpha=MO" --data-urlencode "source_desc=CENSUS" --data-urlencode "agg_level_desc=COUNTY" \
            --data-urlencode "short_desc__LIKE=CHRISTMAS" | scrub > raw/nass_mo_county_christmas_short_desc.json
          # Is EIA up at all from this network? (metadata route, then a daily-frequency data route)
          curl -sS -G "https://api.eia.gov/v2/electricity/rto/region-data/" --data-urlencode "api_key=$EIA_API_KEY" \
            -o raw/eia_meta.json -w "meta %{http_code} %{time_total}s\n" | tee -a raw/eia_probe_summary.txt
          scrub < raw/eia_meta.json > raw/eia_meta.tmp && mv raw/eia_meta.tmp raw/eia_meta.json
          curl -sS -G "https://api.eia.gov/v2/electricity/rto/daily-region-data/data/" --data-urlencode "api_key=$EIA_API_KEY" \
            --data-urlencode "frequency=daily" --data-urlencode "data[0]=value" --data-urlencode "facets[type][]=D" \
            --data-urlencode "facets[respondent][]=MISO" --data-urlencode "facets[timezone][]=Central" \
            --data-urlencode "start=2026-11-10" --data-urlencode "end=2026-11-26" \
            -o raw/eia_daily.json -w "daily %{http_code} %{time_total}s\n" | tee -a raw/eia_probe_summary.txt
          scrub < raw/eia_daily.json > raw/eia_daily.tmp && mv raw/eia_daily.tmp raw/eia_daily.json
          E="https://api.eia.gov/v2/electricity/rto/region-data/data/"
          : > raw/eia_probe_summary.txt.hourly
          probe() {  # name, then extra query args
            name=$1; shift
            curl -sS -G "$E" --data-urlencode "api_key=$EIA_API_KEY" --data-urlencode "frequency=hourly" \
              --data-urlencode "data[0]=value" --data-urlencode "facets[type][]=D" "$@" \
              -o raw/eia_$name.json -w "$name %{http_code} %{time_total}s %{size_download}B\n" | tee -a raw/eia_probe_summary.txt
            scrub < raw/eia_$name.json > raw/eia_$name.tmp && mv raw/eia_$name.tmp raw/eia_$name.json
          }
          probe miso_2d  --data-urlencode "facets[respondent][]=MISO" --data-urlencode "start=2026-11-20T00" --data-urlencode "end=2026-11-21T23"
      - name: Publish snapshot to a throwaway branch
        if: ${{ inputs.snapshot }}
        run: |
          cd raw
          git init -q -b snapshot/raw-sources
          git config user.name "holiday-etl[bot]"; git config user.email "holiday-etl@users.noreply.github.com"
          git add -A && git commit -qm "raw source snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshot/raw-sources
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        if: ${{ !inputs.snapshot }}
      - name: Run ETL
        if: ${{ !inputs.snapshot }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python -m holiday_etl run --allow-missing-keys ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Commit data
        # Each source is validated independently and a failed source never writes its file,
        # so publish whatever passed even when another source failed (the job stays red).
        if: ${{ !cancelled() && !inputs.snapshot }}
        run: |
          git config user.name "holiday-etl[bot]"
          git config user.email "holiday-etl@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "mo-holiday-season: refresh data $(date -u +%F)"
          git push
