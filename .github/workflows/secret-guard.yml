name: secret guard

# Backstop for the local pre-commit hook (hooks are per-clone and can be skipped with --no-verify).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh
